name: Build & Release Flutter Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
          cache: true

      - name: Ensure Android Project Config
        run: |
          flutter create --org edu.uiu.cgpacalculator --platforms android .
          flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK Artifact
        run: |
          mkdir -p apk_output
          find build/ -name "*.apk" -exec cp {} apk_output/UIU-CGPA-Calculator-AI.apk \;
          ls -la apk_output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UIU-CGPA-Calculator-AI-APK
          path: apk_output/UIU-CGPA-Calculator-AI.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: UIU CGPA Calculator AI v1.0.${{ github.run_number }}
          body: |
            ## 🎓 UIU CGPA Calculator AI - Official Release

            ### 📲 Android APK Download:
            Download and install `UIU-CGPA-Calculator-AI.apk` below on your Android phone.

            - **App**: UIU CGPA Calculator AI
            - **Platform**: Android 6.0+ (API 23+)
          files: apk_output/UIU-CGPA-Calculator-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
