name: uiu_cgpa_calculator_ai
description: "UIU CGPA Calculator AI - AI-Supported Academic & CGPA Companion for United International University (UIU) Students"
publish_to: "none"
version: 1.0.12+13

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  file_picker: ^13.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.2
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.png
    - logo.png
